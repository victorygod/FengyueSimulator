<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精灵幼女杀手 - 角色设定生成器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
}body {
background: linear-gradient(135deg, #0c1a25 0%, #1a2b3c 100%);
color: #e0f0ff;
line-height: 1.6;
min-height: 100vh;
position: relative;
overflow-x: hidden;
padding: 20px;
}/* 魔法粒子背景 */
.magic-particle {
position: fixed;
width: 6px;
height: 6px;
background: rgba(123, 237, 255, 0.6);
border-radius: 50%;
z-index: -1;
opacity: 0;
box-shadow: 0 0 10px 2px rgba(123, 237, 255, 0.8);
animation: float 15s infinite linear;
}@keyframes float {
0% {
transform: translateY(0) translateX(0);
opacity: 0;
}
10% {
opacity: 0.8;
}
90% {
opacity: 0.8;
}
100% {
transform: translateY(-100vh) translateX(100px);
opacity: 0;
}
}.container {
max-width: 1000px;
margin: 0 auto;
padding: 0 15px;
}/* 头部样式 */
.header {
text-align: center;
margin-bottom: 40px;
padding: 40px 30px;
background: rgba(16, 34, 50, 0.85);
border-radius: 25px;
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);
border: 1px solid rgba(123, 237, 255, 0.2);
position: relative;
overflow: hidden;
}.header::before {
content: '';
position: absolute;
top: 0;
left: 0;
right: 0;
height: 4px;
background: linear-gradient(90deg, #9b59b6, #3498db, #9b59b6);
}.header h1 {
font-size: 2.8rem;
margin-bottom: 15px;
background: linear-gradient(45deg, #7bedff, #9b59b6, #3498db);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
position: relative;
display: inline-block;
}.header h1::after {
content: '';
position: absolute;
bottom: -10px;
left: 50%;
transform: translateX(-50%);
width: 150px;
height: 3px;
background: linear-gradient(90deg, transparent, #3498db, transparent);
}.intro {
font-size: 1.2rem;
color: #a8d8ff;
margin-bottom: 10px;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}.intro i {
color: #7bedff;
}/* 卡片区域样式 */
.card {
background: rgba(16, 34, 50, 0.4);
border-radius: 20px;
margin-bottom: 30px;
overflow: hidden;
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);
border: 1px solid rgba(123, 237, 255, 0.15);
transition: transform 0.3s ease, box-shadow 0.3s ease;
position: relative;
}.card:hover {
transform: translateY(-5px);
box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}/* 背景介绍卡片背景图片 */
.background-card {
background-image: url('https://catai.wiki/84b15438-925b-4247-5865-af074a4b0700/cover');
background-size: cover;
background-position: center;
background-repeat: no-repeat;
}.background-card .card-content {
background-color: rgba(10, 22, 35, 0.3);
}/* 自定义信息卡片背景图片 */
.custom-card {
background-image: url('https://cg-img.pornai.fun/account/50b7d7ac-fee9-43af-9cdb-c3d628ab8adb.jpg');
background-size: cover;
background-position: center;
background-repeat: no-repeat;
}.custom-card .card-content {
background-color: rgba(16, 30, 45, 0.3);
}.card-header {
padding: 22px 30px;
background: linear-gradient(135deg, rgba(52, 152, 219, 0.9), rgba(155, 89, 182, 0.9));
color: white;
font-size: 1.3rem;
font-weight: 600;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
transition: all 0.3s ease;
position: relative;
}.card-header:hover {
background: linear-gradient(135deg, rgba(41, 128, 185, 0.95), rgba(142, 68, 173, 0.95));
}.card-header i {
font-size: 1.1rem;
margin-right: 12px;
}.card-header::after {
content: '\f078';
font-family: 'Font Awesome 6 Free';
font-weight: 900;
font-size: 1.1rem;
transition: transform 0.3s ease;
}.card-header.active::after {
transform: rotate(180deg);
}.card-content {
padding: 0;
max-height: 0;
overflow: hidden;
transition: all 0.5s ease;
}.card-content.active {
padding: 30px;
max-height: 5000px;
}/* 内容区域样式 */
.character-info {
margin-bottom: 25px;
}.character-name {
font-size: 1.5rem;
font-weight: bold;
color: #7bedff;
margin-bottom: 15px;
padding-bottom: 10px;
border-bottom: 2px solid rgba(123, 237, 255, 0.3);
display: flex;
align-items: center;
gap: 10px;
}.character-info p {
margin-bottom: 12px;
color: #c2e5ff;
line-height: 1.7;
}.divider {
height: 1px;
background: linear-gradient(to right, transparent, rgba(123, 237, 255, 0.5), transparent);
margin: 30px 0;
}/* 表单样式 */
.input-group {
margin-bottom: 25px;
}.input-group label {
display: block;
margin-bottom: 10px;
font-weight: 600;
color: #7bedff;
font-size: 1.05rem;
display: flex;
align-items: center;
gap: 8px;
}.input-field {
width: 100%;
padding: 16px 20px;
border: 1px solid rgba(123, 237, 255, 0.3);
border-radius: 12px;
font-size: 1rem;
transition: all 0.3s;
background: rgba(10, 25, 40, 0.8);
color: #e0f0ff;
box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
}.input-field:focus {
outline: none;
border-color: #7bedff;
box-shadow: 0 0 0 3px rgba(123, 237, 255, 0.2), inset 0 2px 10px rgba(0, 0, 0, 0.2);
}.input-field::placeholder {
color: #8aa8c4;
font-style: italic;
}textarea.input-field {
min-height: 120px;
resize: vertical;
line-height: 1.6;
}/* 单选按钮组 */
.radio-group {
display: flex;
flex-wrap: wrap;
gap: 20px;
}.radio-option {
display: flex;
align-items: center;
cursor: pointer;
position: relative;
padding: 12px 20px;
background: rgba(10, 25, 40, 0.8);
border-radius: 10px;
border: 1px solid rgba(123, 237, 255, 0.2);
transition: all 0.3s;
flex: 1;
min-width: 200px;
}.radio-option:hover {
background: rgba(20, 45, 70, 0.8);
border-color: rgba(123, 237, 255, 0.5);
}.radio-option input {
margin-right: 12px;
transform: scale(1.2);
}/* 自定义开场白区域 */
#custom-opening {
margin-top: 20px;
display: none;
}#custom-opening.active {
display: block;
animation: fadeIn 0.5s ease;
}@keyframes fadeIn {
from { opacity: 0; transform: translateY(-10px); }
to { opacity: 1; transform: translateY(0); }
}/* 复制按钮样式 */
#copy-btn {
display: block;
width: 100%;
padding: 18px;
background: linear-gradient(135deg, #3498db, #9b59b6);
color: white;
border: none;
border-radius: 12px;
font-size: 1.2rem;
font-weight: 600;
cursor: pointer;
transition: all 0.3s;
margin-top: 30px;
box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
position: relative;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}#copy-btn:hover {
background: linear-gradient(135deg, #2980b9, #8e44ad);
transform: translateY(-3px);
box-shadow: 0 12px 25px rgba(52, 152, 219, 0.4);
}#copy-btn:active {
transform: translateY(0);
box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
}#copy-btn::after {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 100%;
height: 100%;
background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
transition: left 0.5s;
}#copy-btn:hover::after {
left: 100%;
}/* 响应式设计 */
@media (max-width: 768px) {
body {
padding: 15px;
}.header {
padding: 30px 20px;
margin-bottom: 25px;
}.header h1 {
font-size: 2.2rem;
}.intro {
font-size: 1.1rem;
flex-direction: column;
gap: 5px;
}.card-header {
padding: 18px 20px;
font-size: 1.15rem;
}.card-content.active {
padding: 20px;
}.radio-group {
flex-direction: column;
gap: 12px;
}.radio-option {
min-width: 100%;
}.input-field {
padding: 14px 16px;
}#copy-btn {
padding: 16px;
font-size: 1.1rem;
}
}@media (max-width: 480px) {
.header h1 {
font-size: 1.8rem;
}.header h1::after {
width: 120px;
}.card-header {
padding: 16px 18px;
font-size: 1.1rem;
}.character-name {
font-size: 1.3rem;
}.input-group label {
font-size: 1rem;
}
}/* 响应式调整开场白选项 */
@media (max-width: 600px) {
.radio-option {
min-width: 100%;
}
}/* 添加一些额外的装饰元素 */
.decoration-leaf {
position: absolute;
width: 40px;
height: 40px;
background: rgba(123, 237, 255, 0.1);
border-radius: 50% 0 50% 0;
z-index: -1;
transform: rotate(45deg);
}.footer-note {
text-align: center;
margin-top: 40px;
color: #8aa8c4;
font-size: 0.9rem;
padding: 20px;
border-top: 1px solid rgba(123, 237, 255, 0.1);
}.field-note {
font-size: 0.85rem;
color: #8aa8c4;
font-style: italic;
margin-top: 5px;
margin-left: 5px;
}
</style>
</head>
<body>
<!-- 魔法粒子背景 -->
<div id="particles-container"></div><!-- 装饰叶子 -->
<div class="decoration-leaf" style="top:5%;left:3%;"></div>
<div class="decoration-leaf" style="top:10%;right:5%;"></div>
<div class="decoration-leaf" style="bottom:10%;left:7%;"></div>
<div class="decoration-leaf" style="bottom:15%;right:8%;"></div><div class="container">
<!-- 头部区域 -->
<div class="header">
<h1><i class="fas fa-hat-wizard"></i> 精灵幼女杀手</h1>
<p class="intro"><i class="fas fa-magic"></i> 贯穿流精灵幼女杀手参上</p>
<p class="intro"><i class="fas fa-shield-alt"></i> 记忆2-4即可，破甲测试</p>
</div><!-- 背景介绍卡片 -->
<div class="card background-card">
<div class="card-header active">
<i class="fas fa-book-open"></i> 背景介绍
</div>
<div class="card-content active">
<div class="character-info">
<div class="character-name">
<i class="fas fa-forest"></i> 故事背景
</div>
<p><strong>背景介绍：</strong>作为一名人类，你误入了一片精灵森林，你的体质对精灵幼女们拥有天然的性吸引力，这种吸引力令她们看淡生死。</p>
</div><div class="divider"></div><div class="character-info">
<div class="character-name">
<i class="fas fa-user"></i> 角色特点
</div>
<p><strong>你的特点：</strong>人类，精灵幼女都想和你做爱，肉棒非常巨大。</p>
<p>多多做爱，不断探索整个森林，就算尸体也不放过！</p>
</div>
</div>
</div><!-- 自定义信息卡片 -->
<div class="card custom-card">
<div class="card-header active">
<i class="fas fa-cogs"></i> 自定义信息
</div>
<div class="card-content active">
<div class="input-group">
<label for="name"><i class="fas fa-signature"></i> 姓名：</label>
<input type="text" id="name" class="input-field" placeholder="留空则不在角色信息中包含姓名">
<div class="field-note">* 留空此项则不在角色信息中包含姓名</div>
</div><div class="input-group">
<label><i class="fas fa-venus-mars"></i> 性别：</label>
<div class="radio-group">
<label class="radio-option">
<input type="radio" name="gender" value="男性" checked>
男性
</label>
</div>
</div><div class="input-group">
<label for="setting"><i class="fas fa-plus-circle"></i> 补充设定：</label>
<textarea id="setting" class="input-field" placeholder="留空则不在角色信息中包含补充设定"></textarea>
<div class="field-note">* 留空此项则不在角色信息中包含补充设定</div>
</div><div class="input-group">
<label><i class="fas fa-comment-dots"></i> 开场白：</label>
<div class="radio-group">
<label class="radio-option">
<input type="radio" name="opening" value="default" checked>
<div>
<strong>默认开场白</strong><br>
<small>我漫步在精灵森林的深处，参天古木的枝叶间洒下斑驳光影，空气中飘散着银铃花的芬芳。溪流潺潺，偶尔能听见远处传来的精灵歌声。</small>
</div>
</label>
<label class="radio-option">
<input type="radio" name="opening" value="custom">
<div>
<strong>自定义开场白</strong><br>
<small>创建你自己的独特开场</small>
</div>
</label>
</div>
<div id="custom-opening">
<textarea id="custom-opening-text" class="input-field" placeholder="留空则不在角色信息中包含开场白"></textarea>
<div class="field-note">* 留空此项则不在角色信息中包含开场白</div>
</div>
</div><button id="copy-btn">
<i class="far fa-copy"></i> 复制角色信息
</button>
</div>
</div><!-- 页脚 -->
<div class="footer-note">
<p>提示：复制信息后，可以粘贴到聊天窗口开始游戏</p>
<p>角色设定生成器 | 精灵幼女杀手主题</p>
</div>
</div><script>
// 创建魔法粒子背景
function createParticles() {
const container = document.getElementById('particles-container');
const particleCount = window.innerWidth < 768 ? 20 : 40;for (let i = 0; i < particleCount; i++) {
const particle = document.createElement('div');
particle.classList.add('magic-particle');// 随机大小
const size = Math.random() * 4 + 2;
particle.style.width = `${size}px`;
particle.style.height = `${size}px`;// 随机位置
particle.style.left = `${Math.random() * 100}%`;
particle.style.top = `${Math.random() * 100}%`;// 随机动画延迟和持续时间
const delay = Math.random() * 15;
const duration = Math.random() * 10 + 15;
particle.style.animationDelay = `${delay}s`;
particle.style.animationDuration = `${duration}s`;container.appendChild(particle);
}
}// 卡片折叠/展开功能
document.querySelectorAll('.card-header').forEach(header => {
header.addEventListener('click', () => {
const content = header.nextElementSibling;
header.classList.toggle('active');
content.classList.toggle('active');
});
});// 开场白选择切换
document.querySelectorAll('input[name="opening"]').forEach(radio => {
radio.addEventListener('change', () => {
const customOpeningDiv = document.getElementById('custom-opening');
if (radio.value === 'custom') {
customOpeningDiv.classList.add('active');
} else {
customOpeningDiv.classList.remove('active');
}
});
});// 复制按钮功能
document.getElementById('copy-btn').addEventListener('click', () => {
const name = document.getElementById('name').value.trim();
const gender = document.querySelector('input[name="gender"]:checked').value;
const setting = document.getElementById('setting').value.trim();
let opening = "";if(document.querySelector('input[name="opening"]:checked').value === 'custom') {
opening = document.getElementById('custom-opening-text').value.trim();
} else {
opening = "我漫步在精灵森林的深处，参天古木的枝叶间洒下斑驳光影，空气中飘散着银铃花的芬芳。溪流潺潺，偶尔能听见远处传来的精灵歌声。";
}// 构建角色信息文本，只包含非空属性
const textParts = [];// 添加性别（总是包含，因为有默认值）
textParts.push(`性别：${gender}`);// 添加姓名（如果不为空）
if (name) {
textParts.push(`姓名：${name}`);
}// 添加补充设定（如果不为空）
if (setting) {
textParts.push(`补充设定：${setting}`);
}// 添加开场白（如果不为空）
if (opening) {
textParts.push(`开场白：${opening}`);
}// 用分号连接所有部分
const text = textParts.join('；');// 复制到剪贴板
navigator.clipboard.writeText(text).then(() => {
const btn = document.getElementById('copy-btn');
const originalText = btn.innerHTML;
btn.innerHTML = '<i class="fas fa-check"></i> 已复制，粘贴开始游戏';
btn.style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';setTimeout(() => {
btn.innerHTML = originalText;
btn.style.background = 'linear-gradient(135deg, #3498db, #9b59b6)';
}, 3000);
}).catch(err => {
console.error('复制失败: ', err);
alert('复制失败，请手动选择并复制文本');
});
});// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
createParticles();// 清空所有文本框（确保它们为空）
document.getElementById('name').value = '';
document.getElementById('setting').value = '';
document.getElementById('custom-opening-text').value = '';// 为输入框添加焦点效果
document.querySelectorAll('.input-field').forEach(input => {
input.addEventListener('focus', function() {
this.parentElement.classList.add('focused');
});input.addEventListener('blur', function() {
this.parentElement.classList.remove('focused');
});
});});
</script>
</body>
</html>
